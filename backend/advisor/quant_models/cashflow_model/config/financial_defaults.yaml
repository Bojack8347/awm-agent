accounts:
  bank:
    default_interest_rate: 0.0
    compound_rate: 12  # monthly compounding
  brokerage:
    default_growth_rate: 7.0  # percentage
  hsa:
    # 2026 self-only HSA contribution limit; family coverage limit is 8750.
    contribution_limit: 4400
    default_employer_contribution: 0
  plan_529:
    annual_contribution_limit: 19000  # per beneficiary (2026 annual gift tax exclusion)
    lifetime_contribution_limit: 500000  # typical state limit
    default_growth_rate: 7.0  # percentage
    qualified_expense_penalty: 10.0  # percentage penalty on earnings for non-qualified withdrawals

# Estimate-grade planning assumptions for an existing mortgage when AWM has a
# confirmed balance but no other loan or property details. Client-supplied
# values always override these defaults, and the AWM bridge discloses each
# effective value in resolved_assumptions.
housing:
  opening_mortgage_defaults:
    # Use the mortgage balance as a conservative property-value proxy so the
    # model does not invent opening home equity.
    home_value_to_mortgage_balance_multiple: 1.0
    home_appreciation_rate: 3.0  # percentage
    interest_rate: 6.5  # percentage
    remaining_term_years: 30
    mortgage_type: fixed_rate
    # Household spending normally includes housing; this also avoids adding a
    # second mortgage payment to a confirmed all-in spending total.
    annual_spending_includes_mortgage: true

# Monte Carlo market assumptions per asset class. Expected returns and
# volatilities are annual percentages; market_beta drives the cross-asset
# correlation matrix (corr[i][j] = beta_i * beta_j). Economic scenario files
# can override any subset of assets or fields.
market_assumptions:
  asset_classes:
    "Cash":
      expected_return: 2.0
      volatility: 1.0
      market_beta: 0.05
    "US Treasury":
      expected_return: 3.5
      volatility: 5.0
      market_beta: 0.15
    "Global Investment Grade Corporate Bond":
      expected_return: 4.5
      volatility: 7.0
      market_beta: 0.25
    "Global High Yield Bond BB-B":
      expected_return: 6.5
      volatility: 12.0
      market_beta: 0.40
    "Emerging Market Local Currency Government Bonds":
      expected_return: 7.0
      volatility: 14.0
      market_beta: 0.45
    "Emerging Market Hard Currency Debt":
      expected_return: 6.5
      volatility: 13.0
      market_beta: 0.45
    "US Equity":
      expected_return: 9.0
      volatility: 18.0
      market_beta: 0.65
    "Dev. Europe ex UK Equity":
      expected_return: 8.0
      volatility: 20.0
      market_beta: 0.68
    "Japan Equity":
      expected_return: 7.5
      volatility: 20.0
      market_beta: 0.66
    "China Equity":
      expected_return: 10.0
      volatility: 28.0
      market_beta: 0.72
    "India Equity":
      expected_return: 11.0
      volatility: 26.0
      market_beta: 0.72
    "Commodities":
      expected_return: 5.0
      volatility: 18.0
      market_beta: 0.35
    "Gold":
      expected_return: 4.0
      volatility: 16.0
      market_beta: 0.15
    "Hedge Funds":
      expected_return: 6.0
      volatility: 10.0
      market_beta: 0.45
    "Bitcoin":
      expected_return: 15.0
      volatility: 70.0
      market_beta: 0.35

healthcare:
  # Healthcare cost trend historically runs above general inflation.
  cost_inflation_rate: 5.0  # percentage
  # Base yearly out-of-pocket medical cost before age multipliers.
  annual_out_of_pocket: 5500
  medicare_start_age: 65
  # 2026 standard Medicare premiums (Part B per CMS; D and Medigap typical).
  medicare_part_b_monthly_premium: 206.50
  medicare_part_d_monthly_premium: 46.50
  medigap_monthly_premium: 155.0
  # Private nursing-home room runs ~130k/yr in 2026 dollars.
  long_term_care_annual_cost: 130000
  # Out-of-pocket multiplier applied from each age threshold upward.
  age_cost_multipliers:
    50: 1.2
    60: 1.5
    70: 2.0
    80: 2.6

insurance:
  life:
    default_loan_interest_rate: 6.0  # percentage
    default_cash_value_growth_rate: 0.0
    default_max_missed_payments: 3
    surrender_percentages:
      early: 0.5  # less than 3 years
      standard: 0.8  # 3+ years

debt:
  credit_card:
    default_interest_rate: 18.0  # percentage
    default_minimum_payment_percent: 2.0  # percentage
