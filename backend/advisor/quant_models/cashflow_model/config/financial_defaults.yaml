# Default financial configuration values for life-model
# Official source ledger: docs/financial_defaults_sources.rst

economy:
  # 2026 SSA COLA based on CPI-W; used as the default recurring expense inflation proxy.
  inflation_rate: 2.8  # percentage

employment:
  salary:
    # AWM planning assumption used only when the client does not provide income growth.
    default_yearly_increase: 3.0  # percentage

tax:
  federal:
    # 2026 tax year; IRS IR-2025-103 / Rev. Proc. 2025-32.
    standard_deduction:
      single: 16100
      married_filing_jointly: 32200
    tax_brackets:
      single:
        - [0, 12400, 10]
        - [12400, 50400, 12]
        - [50400, 105700, 22]
        - [105700, 201775, 24]
        - [201775, 256225, 32]
        - [256225, 640600, 35]
        - [640600, .inf, 37]
      married_filing_jointly:
        - [0, 24800, 10]
        - [24800, 100800, 12]
        - [100800, 211400, 22]
        - [211400, 403550, 24]
        - [403550, 512450, 32]
        - [512450, 768700, 35]
        - [768700, .inf, 37]
    # IRC §86 provisional-income thresholds for taxing Social Security
    # benefits. Fixed by statute since 1984/1993; not inflation indexed.
    social_security_taxation_thresholds:
      single:
        base: 25000
        second: 34000
      married_filing_jointly:
        base: 32000
        second: 44000
    # IRC §121 exclusion of gain on the sale of a primary residence
    home_sale_exclusion:
      single: 250000
      married_filing_jointly: 500000
  state:
    jurisdiction: NY
    tax_year: 2025
    standard_deduction:
      single: 8000
      married_filing_jointly: 16050
    tax_table:
      agi_not_over: 107650
      taxable_income_less_than: 65000
    tax_brackets:
      single:
        - [0, 8500, 4.0]
        - [8500, 11700, 4.5]
        - [11700, 13900, 5.25]
        - [13900, 80650, 5.5]
        - [80650, 215400, 6.0]
        - [215400, 1077550, 6.85]
        - [1077550, 5000000, 9.65]
        - [5000000, 25000000, 10.3]
        - [25000000, .inf, 10.9]
      married_filing_jointly:
        - [0, 17150, 4.0]
        - [17150, 23600, 4.5]
        - [23600, 27900, 5.25]
        - [27900, 161550, 5.5]
        - [161550, 323200, 6.0]
        - [323200, 2155350, 6.85]
        - [2155350, 5000000, 9.65]
        - [5000000, 25000000, 10.3]
        - [25000000, .inf, 10.9]
    high_income_tax_computation:
      single:
        agi_threshold: 107650
        phase_in_end: 157650
        low_income_recapture:
          taxable_income_not_over: 215400
          rate: 6.0
        recapture_segments:
          # [taxable income over, taxable income not over, recapture base, incremental benefit, AGI excess over]
          - [215400, 1077550, 568, 1831, 215400]
          - [1077550, 5000000, 2399, 30172, 1077550]
          - [5000000, 25000000, 32571, 32500, 5000000]
        final_flat_rate:
          agi_over: 25000000
          rate: 10.9
      married_filing_jointly:
        agi_threshold: 107650
        phase_in_end: 157650
        low_income_recapture:
          taxable_income_not_over: 161550
          rate: 5.5
        recapture_segments:
          # [taxable income over, taxable income not over, recapture base, incremental benefit, AGI excess over]
          - [161550, 323200, 333, 807, 161550]
          - [323200, 2155350, 1140, 2747, 323200]
          - [2155350, 5000000, 3887, 60350, 2155350]
          - [5000000, 25000000, 64237, 32500, 5000000]
        final_flat_rate:
          agi_over: 25000000
          rate: 10.9
  trust:
    # Non-grantor trust brackets compress to the top rate within ~$15k of
    # income, so undistributed irrevocable-trust income is taxed flat.
    flat_tax_rate: 37.0  # percentage
  fica:
    social_security_rate: 6.2  # percentage
    social_security_max_income: 184500
    medicare_rate: 1.45  # percentage
    medicare_additional_rate: 0.9  # percentage
    medicare_additional_rate_threshold:
      single: 200000
      married_filing_jointly: 250000

retirement:
  federal_retirement_age: 59.5
  # IRC §72(t) additional tax on pre-tax retirement withdrawals taken
  # before the federal retirement age.
  early_withdrawal_penalty_rate: 10.0  # percentage
  job_401k_contrib_limit:
